        document.addEventListener('DOMContentLoaded', function() {
            const container = document.getElementById('slidesContainer');
            const elements = document.querySelectorAll('.slide-item, .video-item, .video-wrapper');
            const videos = document.querySelectorAll('video');
            const progressBar = document.querySelector('.progress-bar');
            let lastScrollPos = 0;
            let ticking = false;
    
            // Функция для принудительного включения автовоспроизведения
            const initVideos = () => {
                videos.forEach(video => {
                    // Важно для iOS - небольшой таймаут перед первым play()
                    setTimeout(() => {
                        video.muted = true;
                        video.play().then(() => {
                            video.pause();
                        }).catch(e => {
                            console.log('Инициализация видео:', e.message);
                        });
                    }, 300);
                });
            };
    
            // Инициализация видео
            initVideos();
    
            const checkScroll = () => {
                const currentScrollPos = container.scrollTop;
                const scrollHeight = container.scrollHeight;
                const clientHeight = container.clientHeight;
                const scrollPercentage = (currentScrollPos / (scrollHeight - clientHeight)) * 100;
                
                progressBar.style.width = scrollPercentage + '%';
                
                elements.forEach(el => {
                    const elTop = el.getBoundingClientRect().top;
                    if (elTop < container.clientHeight * 0.8) {
                        el.style.opacity = '1';
                        el.style.transform = 'translateY(0)';
                    }
                });
    
                // Управление видео (одинаково для всех устройств)
                videos.forEach(video => {
                    const videoTop = video.getBoundingClientRect().top;
                    const isVisible = videoTop < container.clientHeight && videoTop > -video.offsetHeight;
                    
                    if (isVisible && video.paused) {
                        video.play().catch(e => console.log('Автоплей:', e.message));
                    } else if (!isVisible && !video.paused) {
                        video.pause();
                    }
                });
    
                lastScrollPos = currentScrollPos;
                ticking = false;
            };
    
            container.addEventListener('scroll', () => {
                if (!ticking) {
                    window.requestAnimationFrame(checkScroll);
                    ticking = true;
                }
            });
    
            checkScroll();
    
            // Микроанимации
            document.querySelectorAll('.slide-item, .video-item, .video-wrapper').forEach(item => {
                item.addEventListener('mouseenter', () => {
                    item.style.transform = 'translateY(-5px)';
                    item.style.boxShadow = '0 15px 30px rgba(0,0,0,0.2)';
                });
                
                item.addEventListener('mouseleave', () => {
                    item.style.transform = 'translateY(0)';
                    item.style.boxShadow = '0 10px 25px rgba(0,0,0,0.1)';
                });
            });
        });

<!-- Подключаем виджет ЮKassa -->
<script src="https://yookassa.ru/checkout-widget/v1/checkout-widget.js"></script>

<script>
// 👇 ЗАМЕНИ НА СВОЙ URL С RENDER
const API_URL = 'https://theatre-o08i.onrender.com';

let checkoutWidget = null;

async function initPayment() {
    try {
        const button = document.querySelector('.main-button');
        const paymentForm = document.getElementById('payment-form');
        
        // Показываем загрузку
        button.innerHTML = '<span class="button-text">Подготовка оплаты...</span>';
        button.style.opacity = '0.8';

        console.log('🔄 Создаем платеж...');
        
        const response = await fetch(API_URL + '/create-payment', {
            method: 'POST',
            headers: { 
                'Content-Type': 'application/json' 
            },
            body: JSON.stringify({
                amount: "5000.00",
                description: "Билет в Театр Историй"
            })
        });

        if (!response.ok) {
            const errorData = await response.json();
            throw new Error(errorData.message || 'Ошибка сервера');
        }

        const paymentData = await response.json();
        console.log('✅ Платеж создан:', paymentData);

        if (!paymentData.confirmation_token) {
            throw new Error('Не получили токен для оплаты');
        }

        // Скрываем кнопку и показываем платежную форму
        button.style.display = 'none';
        paymentForm.style.display = 'block';

        // Инициализируем виджет
        checkoutWidget = new window.YooMoneyCheckoutWidget({
            confirmation_token: paymentData.confirmation_token,
            return_url: window.location.href,
            customization: {
                colors: {
                    control_primary: '#8b4513', // Цвет как у твоей кнопки
                    background: '#FFFFFF'
                }
            },
            error_callback: function(error) {
                console.error('❌ Ошибка виджета:', error);
                alert('Ошибка платежной системы. Позвоните нам: +7 926 773 79 70');
                resetPaymentForm();
            }
        });

        // Отображаем платежную форму
        checkoutWidget.render('payment-form');
        
        // Прокручиваем к форме оплаты
        paymentForm.scrollIntoView({ behavior: 'smooth' });

    } catch (error) {
        console.error('❌ Ошибка оплаты:', error);
        
        // Показываем понятное сообщение об ошибке
        if (error.message.includes('CORS') || error.message.includes('Failed to fetch')) {
            alert('Ошибка соединения с сервером оплаты. Пожалуйста, позвоните нам: +7 926 773 79 70');
        } else {
            alert('Ошибка: ' + error.message + '\n\nПозвоните нам: +7 926 773 79 70');
        }
        
        resetPaymentForm();
    }
}

function resetPaymentForm() {
    const button = document.querySelector('.main-button');
    const paymentForm = document.getElementById('payment-form');
    
    // Восстанавливаем кнопку
    button.innerHTML = '<span class="button-text">Купить билет</span>';
    button.style.opacity = '1';
    button.style.display = 'block';
    
    // Скрываем платежную форму
    paymentForm.style.display = 'none';
    
    // Уничтожаем виджет если он был создан
    if (checkoutWidget) {
        try {
            checkoutWidget.destroy();
        } catch (e) {
            console.log('Виджет уже уничтожен');
        }
        checkoutWidget = null;
    }
}

// Закрыть форму оплаты при клике вне ее
document.addEventListener('click', function(event) {
    const paymentForm = document.getElementById('payment-form');
    if (paymentForm.style.display === 'block' && !paymentForm.contains(event.target)) {
        resetPaymentForm();
    }
});
</script>
